# Phase 2A Stabilization - local-only configuration shared by Java and Windows PowerShell.
# Copy to local.env.properties. The real file is ignored by Git.

APP_DEV_BOOTSTRAP=true
APP_DEV_CLIENT_EVENTS_ENABLED=true
APP_FLYWAY_ENABLED=false
SPRING_PROFILES_ACTIVE=local

DB_URL=jdbc:mysql://127.0.0.1:3306/community_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
DB_USERNAME=smart_property_app
DB_PASSWORD=<CHANGE_ME>
MYSQL_EXECUTABLE=C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe

REDIS_HOST=127.0.0.1
REDIS_PORT=6379
REDIS_PASSWORD=
REDIS_EXECUTABLE=
REDIS_CLI_EXECUTABLE=
REDIS_ARGUMENTS=
REDIS_DATA_DIRECTORY=deploy\runtime\redis-data

MINIO_ENDPOINT=http://127.0.0.1:9000
MINIO_CONSOLE_PORT=9001
MINIO_ROOT_USER=<CHANGE_ME>
MINIO_ROOT_PASSWORD=<CHANGE_ME>
MINIO_ACCESS_KEY=<CHANGE_ME>
MINIO_SECRET_KEY=<CHANGE_ME>
MINIO_EXECUTABLE=C:\Program Files\minio\minio.exe
MINIO_DATA_DIRECTORY=deploy\runtime\minio-data
MINIO_PROPERTY_BUCKET=property-assets

APP_BOOTSTRAP_ADMIN_USERNAME=admin
APP_BOOTSTRAP_ADMIN_PASSWORD=<CHANGE_ME>
APP_BOOTSTRAP_VIEWER_USERNAME=viewer
APP_BOOTSTRAP_VIEWER_PASSWORD=<CHANGE_ME>
APP_BOOTSTRAP_RECONCILE_LOCAL=true

# Leave blank to generate a fresh local development key on every backend start.
APP_JWT_SECRET_BASE64=
APP_REFRESH_COOKIE_SECURE=false
APP_ALLOWED_ORIGINS=http://127.0.0.1:5173,http://localhost:5173

# AMap Web Service is only wired in the backend foundation during Stage D1; no request is sent yet.
APP_MAP_PROVIDER=amap
AMAP_WEB_SERVICE_KEY=<CHANGE_ME>
AMAP_WEB_SERVICE_PRIVATE_KEY=<OPTIONAL_IF_AMAP_DIGITAL_SIGNATURE_ENABLED>
AMAP_WEB_SERVICE_BASE_URL=https://restapi.amap.com
