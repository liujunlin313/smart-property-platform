<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1920, initial-scale=1"><title>人员产权居住 ER 图</title><style>html,body{margin:0;background:#f2f7f8;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}svg{display:block;width:1920px;height:1080px;background:#fcfefe}.title{font-size:35px;font-weight:800;fill:#163d45}.sub{font-size:18px;fill:#607d83}.zone{fill:#e8f3f8;stroke:#b6d1dc;stroke-width:1.5}.zone2{fill:#e9f5ef;stroke:#acd5c4;stroke-width:1.5}.cn{font-size:24px;font-weight:800;fill:#163d45}.en{font-size:16px;letter-spacing:.6px;fill:#668389}.field{font-size:17px;fill:#36565d}.small{font-size:15px;fill:#668087}.card rect{fill:#fff;stroke:#3f83a6;stroke-width:2}.card.green rect{stroke:#21826f}.tag{font-size:12px;font-weight:800;fill:#8a6818}.line{stroke:#4a7180;stroke-width:3;fill:none}.relbox{fill:#fcfefe;stroke:#ccdcdf}.rel{font-size:16px;font-weight:800;fill:#315b63}.n{font-size:18px;font-weight:800;fill:#23646a}.callout{fill:#fff8d9;stroke:#e2bf59;stroke-width:1.5}.calloutTitle{font-size:20px;font-weight:800;fill:#815e17}.calloutText{font-size:16px;fill:#6b5725}</style></head><body><svg viewBox="0 0 1920 1080">
<text x="80" y="78" class="title">人员 · 产权 · 居住 ER 图</text><text x="82" y="113" class="sub">核心建模原则：产权关系与居住关系独立，支持“房东拥有、租户居住”的现实场景</text>
<rect class="zone" x="72" y="166" width="590" height="720" rx="30"/><text x="108" y="214" font-size="23" font-weight="800" fill="#35769b">人员主体</text><rect class="zone2" x="716" y="166" width="1120" height="720" rx="30"/><text x="752" y="214" font-size="23" font-weight="800" fill="#247966">房产关系与时间事实</text>
<!-- connectors --> <path class="line" d="M 542 424 L 770 424"/><path class="line" d="M 542 424 L 656 424 L 656 660 L 770 660"/><path class="line" d="M 1090 424 L 1372 424"/><path class="line" d="M 1090 660 L 1372 660"/><path class="line" d="M 1528 520 L 1650 520"/>
<g><rect class="relbox" x="620" y="405" width="54" height="28" rx="12"/><text x="631" y="425" class="rel">拥有</text><text x="553" y="416" class="n">N</text><text x="741" y="416" class="n">N</text></g><g><rect class="relbox" x="620" y="642" width="54" height="28" rx="12"/><text x="631" y="662" class="rel">居住</text><text x="553" y="652" class="n">N</text><text x="741" y="652" class="n">N</text></g><g><rect class="relbox" x="1190" y="405" width="52" height="28" rx="12"/><text x="1201" y="425" class="rel">关联</text><text x="1110" y="416" class="n">N</text><text x="1350" y="416" class="n">N</text></g><g><rect class="relbox" x="1190" y="642" width="52" height="28" rx="12"/><text x="1201" y="662" class="rel">关联</text><text x="1110" y="652" class="n">N</text><text x="1350" y="652" class="n">N</text></g><g><rect class="relbox" x="1538" y="502" width="104" height="28" rx="12"/><text x="1550" y="522" class="rel">当前占用状态</text><text x="1514" y="512" class="n">1</text><text x="1630" y="512" class="n">1</text></g>
<!-- person --> <g class="card"><rect x="166" y="298" width="376" height="252" rx="20"/><text x="196" y="346" class="cn">人员</text><text x="196" y="376" class="en">person</text><rect x="196" y="403" width="32" height="19" rx="4" fill="#fff4cd" stroke="#dab146"/><text x="203" y="418" class="tag">PK</text><text x="239" y="419" class="field">person_id</text><text x="196" y="460" class="field">person_code · 姓名</text><text x="196" y="492" class="field">性别 · 电话 · 证件号</text><text x="196" y="524" class="field">status</text></g>
<!-- ownership --> <g class="card"><rect x="770" y="282" width="320" height="284" rx="20"/><text x="798" y="329" class="cn">产权关系</text><text x="798" y="359" class="en">ownership</text><rect x="798" y="387" width="32" height="19" rx="4" fill="#fff4cd" stroke="#dab146"/><text x="805" y="402" class="tag">PK</text><text x="841" y="403" class="field">ownership_id</text><text x="798" y="442" class="field">FK person_id</text><text x="798" y="473" class="field">FK property_unit_id</text><text x="798" y="504" class="field">ownership_share</text><text x="798" y="535" class="field">start_date · end_date</text></g>
<!-- residence --> <g class="card"><rect x="770" y="586" width="320" height="294" rx="20"/><text x="798" y="633" class="cn">居住关系</text><text x="798" y="663" class="en">residence</text><rect x="798" y="691" width="32" height="19" rx="4" fill="#fff4cd" stroke="#dab146"/><text x="805" y="706" class="tag">PK</text><text x="841" y="707" class="field">residence_id</text><text x="798" y="746" class="field">FK person_id · property_unit_id</text><text x="798" y="777" class="field">residence_role</text><text x="798" y="808" class="field">relation_to_responsible</text><text x="798" y="839" class="field">start/end/expected_end_date</text></g>
<!-- property --> <g class="card green"><rect x="1372" y="344" width="320" height="326" rx="20"/><text x="1402" y="392" class="cn">房产</text><text x="1402" y="422" class="en">property_unit</text><rect x="1402" y="450" width="32" height="19" rx="4" fill="#fff4cd" stroke="#dab146"/><text x="1409" y="465" class="tag">PK</text><text x="1445" y="466" class="field">property_unit_id</text><text x="1402" y="505" class="field">property_no · 楼层</text><text x="1402" y="536" class="field">建筑/使用面积</text><text x="1402" y="567" class="field">occupancy_status</text><text x="1402" y="598" class="field">status</text><text x="1402" y="637" class="small">空间层级由 BuildingUnit 上溯</text></g>
<rect class="callout" x="120" y="694" width="500" height="138" rx="18"/><text x="148" y="733" class="calloutTitle">重点：拥有 ≠ 居住</text><text x="148" y="767" class="calloutText">产权可属于房东，实际居住可属于租户或家庭成员。</text><text x="148" y="796" class="calloutText">两个时间化 N:M 关系分别保存，避免现实语义混淆。</text>
<rect x="1138" y="722" width="565" height="110" rx="16" fill="#f6faf9" stroke="#b5d8c9"/><text x="1166" y="758" class="note">当前态约束：一个人当前只能有一处居住；</text><text x="1166" y="790" class="note">同一房产当前只能有一个 RESPONSIBLE 责任人。</text>
<line x1="80" y1="954" x2="1840" y2="954" stroke="#d6e2e1"/><text x="82" y="992" class="small">关系判断依据：Ownership / Residence 均含两端 FK、起止日期和历史唯一键；因此是时间化 N:M，而不是 Person 到 PropertyUnit 的简单 1:N。</text>
</svg></body></html>
