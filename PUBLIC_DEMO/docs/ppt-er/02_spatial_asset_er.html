<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1920, initial-scale=1"><title>空间资产 ER 图</title><style>html,body{margin:0;background:#f4f8f7;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}svg{display:block;width:1920px;height:1080px;background:#fbfdfd}.title{font-size:35px;font-weight:800;fill:#173d42}.sub{font-size:17px;fill:#638083}.area{fill:#e7f5f0;stroke:#b1d8cb;stroke-width:1.5}.area2{fill:#edf5f7;stroke:#bfd5da;stroke-width:1.5}.areaTitle{font-size:22px;font-weight:800;fill:#187568}.card rect{fill:#fff;stroke:#168475;stroke-width:2}.cn{font-size:22px;font-weight:800;fill:#173d42}.en{font-size:15px;fill:#668286;letter-spacing:.6px}.field{font-size:16px;fill:#36565c}.tag{font-size:12px;font-weight:800;fill:#8a6818}.tagbox{fill:#fff4cd;stroke:#dab146}.line{stroke:#427579;stroke-width:3;fill:none}.relbox{fill:#fbfdfd;stroke:#d2dfdc}.rel{font-size:15px;font-weight:800;fill:#315c5f}.cardinality{font-size:17px;font-weight:800;fill:#1e6561}.note{font-size:17px;fill:#607c80}.small{font-size:14px;fill:#698488}</style></head><body><svg viewBox="0 0 1920 1080">
<text x="78" y="78" class="title">空间资产 ER 图</text><text x="80" y="112" class="sub">物业管理需要小区、楼栋、单元、房产四级空间粒度；房产是最小完整管理单位</text>
<rect class="area" x="68" y="164" width="1190" height="720" rx="28"/><text x="102" y="210" class="areaTitle">空间资产层级</text><rect class="area2" x="1310" y="164" width="540" height="720" rx="28"/><text x="1344" y="210" class="areaTitle">可复用户型定义</text>
<!-- lines --> <path class="line" d="M 322 508 L 475 508"/><path class="line" d="M 708 508 L 860 508"/><path class="line" d="M 1094 508 L 1310 508"/>
<g><rect class="relbox" x="365" y="489" width="66" height="26" rx="12"/><text x="377" y="508" class="rel">包含</text><text x="329" y="500" class="cardinality">1</text><text x="450" y="500" class="cardinality">N</text></g><g><rect class="relbox" x="750" y="489" width="66" height="26" rx="12"/><text x="762" y="508" class="rel">包含</text><text x="715" y="500" class="cardinality">1</text><text x="835" y="500" class="cardinality">N</text></g><g><rect class="relbox" x="1160" y="489" width="86" height="26" rx="12"/><text x="1172" y="508" class="rel">复用模板</text><text x="1104" y="500" class="cardinality">N</text><text x="1282" y="500" class="cardinality">1</text></g>
<!-- community --> <g class="card"><rect x="90" y="364" width="232" height="288" rx="18"/><text x="116" y="408" class="cn">小区</text><text x="116" y="435" class="en">community</text><rect x="116" y="461" width="31" height="18" rx="4" fill="#fff4cd" stroke="#dab146"/><text x="123" y="475" class="tag">PK</text><text x="157" y="476" class="field">community_id</text><text x="116" y="513" class="field">community_code</text><text x="116" y="542" class="field">community_name</text><text x="116" y="571" class="field">address_line</text><text x="116" y="600" class="field">longitude / latitude</text><text x="116" y="629" class="field">status</text></g>
<!-- building --> <g class="card"><rect x="475" y="350" width="233" height="316" rx="18"/><text x="501" y="394" class="cn">楼栋</text><text x="501" y="421" class="en">building</text><rect x="501" y="447" width="31" height="18" rx="4" fill="#fff4cd" stroke="#dab146"/><text x="508" y="461" class="tag">PK</text><text x="542" y="462" class="field">building_id</text><text x="501" y="499" class="field">FK community_id</text><text x="501" y="528" class="field">building_no</text><text x="501" y="557" class="field">building_name</text><text x="501" y="586" class="field">total_floors</text><text x="501" y="615" class="field">坐标 / 状态</text><text x="501" y="645" class="small">UQ(community_id, building_no)</text></g>
<!-- unit --> <g class="card"><rect x="860" y="364" width="234" height="288" rx="18"/><text x="886" y="408" class="cn">单元</text><text x="886" y="435" class="en">building_unit</text><rect x="886" y="461" width="31" height="18" rx="4" fill="#fff4cd" stroke="#dab146"/><text x="893" y="475" class="tag">PK</text><text x="927" y="476" class="field">building_unit_id</text><text x="886" y="513" class="field">FK building_id</text><text x="886" y="542" class="field">unit_no</text><text x="886" y="571" class="field">unit_name</text><text x="886" y="600" class="field">status</text><text x="886" y="629" class="small">UQ(building_id, unit_no)</text></g>
<!-- property --> <g class="card"><rect x="1120" y="315" width="260" height="386" rx="18"/><text x="1146" y="359" class="cn">房产</text><text x="1146" y="386" class="en">property_unit</text><rect x="1146" y="412" width="31" height="18" rx="4" fill="#fff4cd" stroke="#dab146"/><text x="1153" y="426" class="tag">PK</text><text x="1187" y="427" class="field">property_unit_id</text><text x="1146" y="464" class="field">FK building_unit_id</text><text x="1146" y="493" class="field">FK layout_template_id</text><text x="1146" y="522" class="field">property_no · floor_no</text><text x="1146" y="551" class="field">gross_area · usable_area</text><text x="1146" y="580" class="field">property_use</text><text x="1146" y="609" class="field">occupancy_status</text><text x="1146" y="638" class="field">status</text><text x="1146" y="676" class="small">UQ(building_unit_id, property_no)</text></g>
<!-- layout --> <g class="card"><rect x="1440" y="350" width="330" height="316" rx="18" stroke="#4d8790"/><text x="1468" y="394" class="cn">户型模板</text><text x="1468" y="421" class="en">layout_template</text><rect x="1468" y="447" width="31" height="18" rx="4" fill="#fff4cd" stroke="#dab146"/><text x="1475" y="461" class="tag">PK</text><text x="1509" y="462" class="field">layout_template_id</text><text x="1468" y="499" class="field">layout_code</text><text x="1468" y="528" class="field">layout_name · layout_type</text><text x="1468" y="557" class="field">standard_area</text><text x="1468" y="586" class="field">status</text><text x="1468" y="625" class="small">可由多套房产复用，不复制户型定义</text></g>
<rect x="1460" y="742" width="294" height="91" rx="14" fill="#f6faf9" stroke="#b8d2cf"/><text x="1484" y="776" class="note">户型图是工程文件关联：</text><text x="1484" y="805" class="small">单房覆盖 → 面积变体 → 模板默认</text>
<text x="90" y="940" class="note">设计要点：不引入不存在的 Room 实体。PropertyUnit 才是产权、居住、收费、表计、车证关联的最小完整房产单位。</text>
<line x1="78" y1="990" x2="1840" y2="990" stroke="#d4e1df"/><text x="80" y="1025" class="small">基数：1 = 一个，N = 多个。所有关系来自当前 V10 外键与唯一约束；本图仅展示业务模型，未将 MinIO/FileObject 等工程表展开。</text>
</svg></body></html>
