<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1920, initial-scale=1"><title>收费计量 ER 图</title>
<style>html,body{margin:0;background:#f3f6fb;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}svg{display:block;width:1920px;height:1080px;background:#fcfdff}.title{font-size:35px;font-weight:800;fill:#183d58}.sub{font-size:18px;fill:#617b8a}.zone{fill:#edf3ff;stroke:#bfd0ec;stroke-width:1.5}.zone2{fill:#eff7f5;stroke:#c0ddd5;stroke-width:1.5}.cn{font-size:22px;font-weight:800;fill:#183d58}.en{font-size:15px;letter-spacing:.6px;fill:#67818e}.field{font-size:16px;fill:#35566a}.small{font-size:14px;fill:#68808e}.card rect{fill:#fff;stroke:#4d77be;stroke-width:2}.card.green rect{stroke:#2b887b}.line{stroke:#4f6f86;stroke-width:3;fill:none}.relbox{fill:#fcfdff;stroke:#cfdae3}.rel{font-size:15px;font-weight:800;fill:#31566d}.n{font-size:17px;font-weight:800;fill:#275c76}.callout{fill:#fff7dc;stroke:#dfbd62;stroke-width:1.5}.calloutT{font-size:19px;font-weight:800;fill:#835e16}.calloutX{font-size:15px;fill:#6a5727}</style></head>
<body><svg viewBox="0 0 1920 1080" aria-label="收费计量 ER 图">
<text x="78" y="76" class="title">收费 · 表计 · 账单 · 缴费 ER 图</text><text x="80" y="112" class="sub">应收、费用构成与实际缴费分别建模；统计从真实账单与成功缴费聚合，而不是从前端计算</text>
<rect class="zone" x="64" y="164" width="760" height="724" rx="28"/><text x="98" y="210" font-size="22" font-weight="800" fill="#416eb2">收费规则</text><rect class="zone2" x="850" y="164" width="1002" height="724" rx="28"/><text x="884" y="210" font-size="22" font-weight="800" fill="#267b70">房产计量与账务事实</text>
<!-- 连接线优先绘制；每一条均避开实体框 -->
<path class="line" d="M 380 335 L 440 335"/><path class="line" d="M 1150 345 L 1240 345"/><path class="line" d="M 1540 345 L 1600 345"/><path class="line" d="M 995 420 L 995 600"/><path class="line" d="M 940 680 L 1030 680"/>
<path class="line" d="M 760 335 L 800 335 L 800 838 L 1000 838 L 1000 760 L 1030 760"/><path class="line" d="M 1600 350 L 1560 350 L 1560 560 L 1140 560 L 1140 600"/><path class="line" d="M 790 760 L 790 858 L 1390 858 L 1390 760 L 1420 760"/>
<!-- 关系名与基数 -->
<g><rect class="relbox" x="388" y="319" width="43" height="26" rx="12"/><text x="399" y="338" class="rel">制定</text><text x="365" y="325" class="n">1</text><text x="425" y="325" class="n">N</text></g><g><rect class="relbox" x="1160" y="329" width="72" height="26" rx="12"/><text x="1171" y="348" class="rel">安装表计</text><text x="1130" y="334" class="n">1</text><text x="1225" y="334" class="n">N</text></g><g><rect class="relbox" x="1548" y="329" width="43" height="26" rx="12"/><text x="1559" y="348" class="rel">抄读</text><text x="1520" y="334" class="n">1</text><text x="1585" y="334" class="n">N</text></g><g><rect class="relbox" x="1005" y="481" width="74" height="26" rx="12"/><text x="1016" y="500" class="rel">按期出账</text><text x="982" y="474" class="n">1</text><text x="982" y="592" class="n">N</text></g><g><rect class="relbox" x="948" y="664" width="72" height="26" rx="12"/><text x="959" y="683" class="rel">包含明细</text><text x="926" y="669" class="n">1</text><text x="1017" y="669" class="n">N</text></g><g><rect class="relbox" x="812" y="812" width="104" height="26" rx="12"/><text x="823" y="831" class="rel">采用收费标准</text><text x="784" y="830" class="n">1</text><text x="990" y="830" class="n">N</text></g><g><rect class="relbox" x="1320" y="544" width="72" height="26" rx="12"/><text x="1331" y="563" class="rel">引用读数</text><text x="1547" y="384" class="n">1</text><text x="1125" y="592" class="n">N</text></g><g><rect class="relbox" x="1075" y="842" width="72" height="26" rx="12"/><text x="1086" y="861" class="rel">实际缴费</text><text x="1062" y="853" class="n">1</text><text x="1395" y="749" class="n">N</text></g>
<!-- 实体 -->
<g class="card"><rect x="100" y="280" width="280" height="110" rx="18"/><text x="126" y="324" class="cn">收费类别</text><text x="126" y="351" class="en">fee_type</text><text x="126" y="375" class="field">fee_code · billing_method</text></g><g class="card"><rect x="440" y="270" width="320" height="130" rx="18"/><text x="466" y="314" class="cn">收费标准</text><text x="466" y="341" class="en">fee_standard</text><text x="466" y="367" class="field">FK community_id · fee_type_id</text><text x="466" y="388" class="field">unit_price · 生效区间</text></g><g class="card green"><rect x="840" y="270" width="310" height="150" rx="18"/><text x="868" y="315" class="cn">房产</text><text x="868" y="342" class="en">property_unit</text><text x="868" y="368" class="field">property_unit_id · property_no</text><text x="868" y="396" class="field">面积 · 居住状态</text></g><g class="card"><rect x="1240" y="270" width="300" height="150" rx="18"/><text x="1266" y="315" class="cn">表计设备</text><text x="1266" y="342" class="en">meter</text><text x="1266" y="368" class="field">FK property_unit · fee_type</text><text x="1266" y="396" class="field">meter_no · initial_reading</text></g><g class="card"><rect x="1600" y="270" width="220" height="150" rx="18"/><text x="1622" y="315" class="cn">抄表读数</text><text x="1622" y="342" class="en">meter_reading</text><text x="1622" y="368" class="field">reading_at</text><text x="1622" y="396" class="field">reading_value</text></g>
<g class="card green"><rect x="640" y="600" width="300" height="160" rx="18"/><text x="668" y="645" class="cn">应收账单</text><text x="668" y="672" class="en">bill</text><text x="668" y="698" class="field">bill_no · 账期 · due_date</text><text x="668" y="726" class="field">status</text><text x="668" y="748" class="field">UQ(房产, 年, 月)</text></g><g class="card"><rect x="1030" y="600" width="300" height="160" rx="18"/><text x="1058" y="645" class="cn">账单费用明细</text><text x="1058" y="672" class="en">bill_item</text><text x="1058" y="698" class="field">PK bill_id + item_no</text><text x="1058" y="726" class="field">FK fee_standard / reading</text><text x="1058" y="748" class="field">quantity · unit_price · amount</text></g><g class="card green"><rect x="1420" y="600" width="300" height="160" rx="18"/><text x="1448" y="645" class="cn">实际缴费</text><text x="1448" y="672" class="en">payment</text><text x="1448" y="698" class="field">FK bill_id · payer_person_id</text><text x="1448" y="726" class="field">amount · paid_at · method</text><text x="1448" y="748" class="field">status</text></g>
<rect class="callout" x="130" y="918" width="1660" height="78" rx="16"/><text x="160" y="951" class="calloutT">重点：</text><text x="245" y="951" class="calloutX">FeeType 是类别，FeeStandard 是具体规则；Meter 是设备，MeterReading 是时刻读数；Bill 是应收，BillItem 是构成，Payment 是实际缴费。</text><text x="132" y="1035" class="small">统计事实源：v_bill_financial_summary 由 BillItem 聚合应收、SUCCESS Payment 聚合实收并计算欠费；本图不把视图作为物理实体。</text>
</svg></body></html>
