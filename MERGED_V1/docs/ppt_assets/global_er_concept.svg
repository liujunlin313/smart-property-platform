<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">多小区智慧物业管理系统：全局概念 ER 图</title>
  <desc id="desc">以房产为中心，展示空间资产、人员居住、收费计量和停车业务的核心实体与业务关系。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; }
    .title { fill:#183e45; font-size:37px; font-weight:800; letter-spacing:1px; }
    .sub { fill:#617c81; font-size:17px; }
    .entity { fill:#eaf4f3; stroke:#3f777b; stroke-width:2.2; }
    .entity.core { fill:#dcefed; stroke:#20746f; stroke-width:3; }
    .rel { fill:#fbf1df; stroke:#a87838; stroke-width:2.1; }
    .line { fill:none; stroke:#60777b; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .entity-text { fill:#163f46; font-size:23px; font-weight:800; text-anchor:middle; dominant-baseline:middle; }
    .relation-text { fill:#765520; font-size:18px; font-weight:800; text-anchor:middle; dominant-baseline:middle; }
    .group { fill:#4e777d; font-size:16px; font-weight:800; letter-spacing:2px; }
    .legend-text { fill:#60777b; font-size:15px; }
  </style>

  <rect width="1920" height="1080" fill="#fcfdfd"/>
  <text x="76" y="75" class="title">多小区智慧物业管理系统 · 全局概念 ER 图</text>
  <text x="78" y="109" class="sub">仅展示现实业务实体与业务联系，不展示字段、主外键与实现层支撑表</text>
  <line x1="76" y1="138" x2="1844" y2="138" stroke="#d8e4e3" stroke-width="1.5"/>

  <!-- 空间资产主线：实体与关系均保持水平、等距的阅读节奏 -->
  <text x="80" y="180" class="group">空间资产主线</text>
  <text x="1000" y="180" class="group">核心锚点</text>
  <path class="line" d="M260 257 H272 M348 257 H380"/>
  <path class="line" d="M560 257 H572 M648 257 H680"/>
  <path class="line" d="M860 257 H872 M948 257 H960"/>
  <path class="line" d="M1200 257 H1287 M1363 257 H1400"/>

  <rect class="entity" x="80" y="220" width="180" height="74" rx="10"/>
  <text class="entity-text" x="170" y="257">小区</text>
  <polygon class="rel" points="310,221 348,257 310,293 272,257"/>
  <text class="relation-text" x="310" y="257">包含</text>
  <rect class="entity" x="380" y="220" width="180" height="74" rx="10"/>
  <text class="entity-text" x="470" y="257">楼栋</text>
  <polygon class="rel" points="610,221 648,257 610,293 572,257"/>
  <text class="relation-text" x="610" y="257">包含</text>
  <rect class="entity" x="680" y="220" width="180" height="74" rx="10"/>
  <text class="entity-text" x="770" y="257">单元</text>
  <polygon class="rel" points="910,221 948,257 910,293 872,257"/>
  <text class="relation-text" x="910" y="257">包含</text>
  <rect class="entity core" x="960" y="205" width="240" height="104" rx="12"/>
  <text class="entity-text" x="1080" y="257" font-size="28px">房产</text>
  <polygon class="rel" points="1325,221 1363,257 1325,293 1287,257"/>
  <text class="relation-text" x="1325" y="257">采用</text>
  <rect class="entity" x="1400" y="220" width="210" height="74" rx="10"/>
  <text class="entity-text" x="1505" y="257">户型模板</text>

  <!-- 人员与房产：三种关系使用等距纵向菱形，端点独立、无交叉 -->
  <text x="90" y="350" class="group">人员与居住主线</text>
  <path class="line" d="M560 467 H600 V405 H650 M750 405 H980 V309"/>
  <path class="line" d="M560 488 H650 M750 488 H1060 V309"/>
  <path class="line" d="M560 509 H600 V571 H650 M750 571 H1140 V309"/>

  <rect class="entity" x="360" y="445" width="200" height="86" rx="10"/>
  <text class="entity-text" x="460" y="488">人员</text>
  <polygon class="rel" points="700,369 750,405 700,441 650,405"/>
  <text class="relation-text" x="700" y="405">拥有</text>
  <polygon class="rel" points="700,452 750,488 700,524 650,488"/>
  <text class="relation-text" x="700" y="488">居住</text>
  <polygon class="rel" points="700,535 750,571 700,607 650,571"/>
  <text class="relation-text" x="700" y="571">授权</text>

  <!-- 收费与计量：计量支线与账单支线分层排布 -->
  <text x="1250" y="400" class="group">收费与计量主线</text>
  <path class="line" d="M1200 285 H1240 V475 H1273 M1357 475 H1370"/>
  <path class="line" d="M1560 475 H1582 M1658 475 H1680"/>
  <path class="line" d="M1160 309 V675 H1232 M1308 675 H1340"/>
  <path class="line" d="M1540 675 H1560 M1640 675 H1660"/>
  <path class="line" d="M440 531 V825 H1078 M1162 825 H1740 V710"/>

  <polygon class="rel" points="1315,437 1357,475 1315,513 1273,475"/>
  <text class="relation-text" x="1315" y="475">配置</text>
  <rect class="entity" x="1370" y="440" width="190" height="70" rx="10"/>
  <text class="entity-text" x="1465" y="475">仪表</text>
  <polygon class="rel" points="1620,437 1658,475 1620,513 1582,475"/>
  <text class="relation-text" x="1620" y="475">包含</text>
  <rect class="entity" x="1680" y="440" width="160" height="70" rx="10"/>
  <text class="entity-text" x="1760" y="475">费用类型</text>

  <polygon class="rel" points="1270,637 1308,675 1270,713 1232,675"/>
  <text class="relation-text" x="1270" y="675">生成</text>
  <rect class="entity" x="1340" y="640" width="200" height="70" rx="10"/>
  <text class="entity-text" x="1440" y="675">账单</text>
  <polygon class="rel" points="1600,637 1640,675 1600,713 1560,675"/>
  <text class="relation-text" x="1600" y="675">对应</text>
  <rect class="entity" x="1660" y="640" width="180" height="70" rx="10"/>
  <text class="entity-text" x="1750" y="675">缴费记录</text>
  <polygon class="rel" points="1120,787 1162,825 1120,863 1078,825"/>
  <text class="relation-text" x="1120" y="825">支付</text>

  <!-- 停车业务扩展：独立置于左下，避免与支付链路共线 -->
  <text x="80" y="620" class="group">停车业务扩展</text>
  <path class="line" d="M230 695 H250 M330 695 H345 V488 H360"/>
  <path class="line" d="M500 531 V760 H530 M610 760 H650"/>

  <rect class="entity" x="60" y="660" width="170" height="70" rx="10"/>
  <text class="entity-text" x="145" y="695">车辆</text>
  <polygon class="rel" points="290,659 330,695 290,731 250,695"/>
  <text class="relation-text" x="290" y="695">登记</text>
  <polygon class="rel" points="570,724 610,760 570,796 530,760"/>
  <text class="relation-text" x="570" y="760">申请</text>
  <rect class="entity" x="650" y="725" width="180" height="70" rx="10"/>
  <text class="entity-text" x="740" y="760">车证</text>

  <!-- 图例与说明 -->
  <line x1="76" y1="1004" x2="1844" y2="1004" stroke="#d8e4e3" stroke-width="1.5"/>
  <rect class="entity" x="82" y="1024" width="58" height="28" rx="5"/>
  <text x="153" y="1045" class="legend-text">矩形：实体</text>
  <polygon class="rel" points="305,1024 325,1038 305,1052 285,1038"/>
  <text x="338" y="1045" class="legend-text">菱形：关系</text>
  <text x="566" y="1045" class="legend-text">说明：本图为课堂需求分析阶段的概念 ER 图，不展示属性、PK、FK、基数和工程支撑表。</text>
</svg>
